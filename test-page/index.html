<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Privacy Agent - Sample Form Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 40px;
      color: #1e293b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 { color: #1e3a8a; margin-top: 0; }
    h2 { color: #2563eb; margin-top: 24px; font-size: 1.25rem; }
    h3 { color: #475569; font-size: 1rem; margin-top: 16px; }
    p { color: #64748b; line-height: 1.5; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nexus Privacy Agent Test Portal</h1>
    <p>This live portal is used to verify on-device PII detection, automatic privacy masking, and SafeContext enforcement.</p>
    
    <h2>User Profile & Security Verification</h2>
    <h3>Section A: Personal & Financial Information</h3>
    
    <form id="sample-form" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" value="Alex Rivera" />
      </div>

      <div class="form-group">
        <label for="email-address">Email Address</label>
        <input type="email" id="email-address" name="email" placeholder="alex@nexus.ai" value="alex@nexus.ai" />
      </div>

      <div class="form-group">
        <label for="phone-number">Phone Number</label>
        <input type="text" id="phone-number" name="phone" placeholder="+91 98765 43210" value="+91 98765 43210" />
      </div>

      <div class="form-group">
        <label for="aadhaar-number">Aadhaar Card Number (UIDAI)</label>
        <input type="text" id="aadhaar-number" name="aadhaar" placeholder="12-digit Aadhaar" value="2345 6789 0123" />
      </div>

      <div class="form-group">
        <label for="pan-number">Income Tax PAN Number</label>
        <input type="text" id="pan-number" name="pan" placeholder="10-digit PAN" value="ABCDE1234F" />
      </div>

      <div class="form-group">
        <label for="ssn-number">Social Security Number (SSN)</label>
        <input type="text" id="ssn-number" name="ssn" placeholder="XXX-XX-XXXX" value="123-45-6789" />
      </div>

      <div class="form-group">
        <label for="card-number">Credit / Debit Card</label>
        <input type="text" id="card-number" name="cardNumber" placeholder="16-digit Card Number" value="4532 8901 2345 6789" />
      </div>

      <div class="form-group">
        <label for="account-password">Account Password / Auth Token</label>
        <input type="text" id="account-password" name="password" placeholder="Account Secret" value="SuperSecretPassword123!" />
      </div>

      <div class="form-group">
        <label for="agent-role">Agent Access Level</label>
        <select id="agent-role" name="role">
          <option value="admin">Security Administrator</option>
          <option value="auditor" selected>Privacy Auditor</option>
          <option value="operator">Agent Operator</option>
        </select>
      </div>

      <div class="form-group">
        <button type="button" id="submit-application-btn">Save Agent Profile</button>
        <button type="reset" id="reset-btn" style="background: #64748b; margin-left: 10px;">Clear Form</button>
      </div>

      <div role="status" class="status-badge" id="agent-status-banner">
        Agent Status: Ready for extraction &amp; execution
      </div>
    </form>
  </div>
</body>
</html>

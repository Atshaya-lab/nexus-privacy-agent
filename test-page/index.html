<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Nexus Privacy Agent - Sample Form Test Page</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #f0f4f8;
      margin: 0;
      padding: 40px;
      color: #1e293b;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }
    h1 { color: #1e3a8a; margin-top: 0; }
    h2 { color: #2563eb; margin-top: 24px; font-size: 1.25rem; }
    h3 { color: #475569; font-size: 1rem; margin-top: 16px; }
    p { color: #64748b; line-height: 1.5; }
    .form-group {
      margin-bottom: 18px;
    }
    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }
    input[type="text"], input[type="email"], select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      font-size: 0.95rem;
      box-sizing: border-box;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      padding: 12px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
    }
    .status-badge {
      display: inline-block;
      padding: 6px 12px;
      background: #dbeafe;
      color: #1d4ed8;
      border-radius: 6px;
      font-size: 0.85rem;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Nexus Privacy Agent Test Portal</h1>
    <p>This page is used to verify DOM extraction and viewport screenshot capture in Chrome.</p>
    
    <h2>Account Registration Form</h2>
    <h3>Section A: User Identity</h3>
    
    <form id="sample-form" onsubmit="event.preventDefault();">
      <div class="form-group">
        <label for="full-name">Full Name</label>
        <input type="text" id="full-name" name="fullName" placeholder="Enter your full name" value="Alex Rivera" />
      </div>

      <div class="form-group">
        <label for="email-address">Email Address</label>
        <input type="email" id="email-address" name="email" placeholder="alex@nexus.ai" value="alex@nexus.ai" />
      </div>

      <div class="form-group">
        <label for="agent-role">Agent Access Level</label>
        <select id="agent-role" name="role">
          <option value="admin">Security Administrator</option>
          <option value="auditor" selected>Privacy Auditor</option>
          <option value="operator">Agent Operator</option>
        </select>
      </div>

      <div class="form-group">
        <label for="security-notes">Compliance Notes</label>
        <textarea id="security-notes" name="notes" rows="3" placeholder="Add any privacy notes...">All personal data is encrypted in transit and at rest.</textarea>
      </div>

      <div class="form-group">
        <button type="button" id="submit-application-btn">Save Agent Profile</button>
        <a href="#terms" id="terms-link" style="margin-left: 15px;">Review Privacy Policy</a>
      </div>

      <div role="status" class="status-badge" id="agent-status-banner">
        Agent Status: Ready for extraction
      </div>
    </form>
  </div>
</body>
</html>
